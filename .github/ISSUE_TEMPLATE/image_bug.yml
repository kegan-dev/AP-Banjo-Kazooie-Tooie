name: Image bug
description: Something wrong with the image itself, at a door or a switch between the games.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, in which game, and what went wrong.
    validations:
      required: true
  - type: dropdown
    id: emulator
    attributes:
      label: Emulator or hardware
      options:
        - Project64 3.0.1
        - ares v148
        - mupen64plus
        - Something else (say which above)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or release
